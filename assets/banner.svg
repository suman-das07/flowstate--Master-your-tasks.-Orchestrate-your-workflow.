<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">Flowstate banner</title><desc id="d">Animated banner: task cards ride a conveyor belt, matching the Flowstate idea of moving tasks through a workflow.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C5D7C7"/><stop offset="1" stop-color="#e8f1e6"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#3f6b4d"/></linearGradient>
<clipPath id="belt"><rect x="640" y="60" width="520" height="200" rx="18"/></clipPath>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/>
<circle cx="120" cy="60" r="46" fill="#ffffff" opacity="0.35"><animate attributeName="cy" values="60;74;60" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="560" cy="270" r="34" fill="#ffffff" opacity="0.35"><animate attributeName="cy" values="270;258;270" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="1120" cy="40" r="52" fill="#ffffff" opacity="0.35"><animate attributeName="cy" values="40;50;40" dur="11s" repeatCount="indefinite"/></circle>
<circle cx="330" cy="285" r="26" fill="#ffffff" opacity="0.35"><animate attributeName="cy" values="285;275;285" dur="8s" repeatCount="indefinite"/></circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" begin="0.2s" dur="0.9s" fill="freeze"/><text x="70" y="150" font-size="92" font-weight="700" fill="url(#ink)" letter-spacing="-2" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">Flowstate</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.9s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" begin="0.7s" dur="0.9s" fill="freeze"/><text x="72" y="200" font-size="25" font-weight="400" fill="#374151" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">Master your tasks. Orchestrate your workflow.</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.9s" fill="freeze"/><rect x="72" y="228" width="400" height="34" rx="17" fill="#374151"/><text x="272" y="250" text-anchor="middle" font-size="14" fill="#e5efe6" letter-spacing="0.4" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">Plain HTML · CSS · JavaScript — no backend</text></g>
<rect x="640" y="60" width="520" height="200" rx="18" fill="#ffffff" opacity="0.55"/>
<g clip-path="url(#belt)">
<line x1="640" y1="196" x2="1160" y2="196" stroke="#374151" stroke-width="3" stroke-dasharray="14 10" opacity="0.5"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.8s" repeatCount="indefinite"/></line>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="7.5s" begin="-0.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="620 0" to="1180 0" dur="7.5s" begin="-0.0s" repeatCount="indefinite"/><rect x="0" y="124" width="120" height="62" rx="10" fill="#7F2938"/><rect x="12" y="138" width="64" height="8" rx="4" fill="#ffffff" opacity="0.9"/><rect x="12" y="156" width="42" height="6" rx="3" fill="#ffffff" opacity="0.55"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="7.5s" begin="-2.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="620 0" to="1180 0" dur="7.5s" begin="-2.5s" repeatCount="indefinite"/><rect x="0" y="124" width="120" height="62" rx="10" fill="#F4E8C8"/><rect x="12" y="138" width="64" height="8" rx="4" fill="#70531F" opacity="0.9"/><rect x="12" y="156" width="42" height="6" rx="3" fill="#70531F" opacity="0.55"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="7.5s" begin="-5.0s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" from="620 0" to="1180 0" dur="7.5s" begin="-5.0s" repeatCount="indefinite"/><rect x="0" y="124" width="120" height="62" rx="10" fill="#DCE9D8"/><rect x="12" y="138" width="64" height="8" rx="4" fill="#365638" opacity="0.9"/><rect x="12" y="156" width="42" height="6" rx="3" fill="#365638" opacity="0.55"/></g>
</g>
<text x="900" y="96" text-anchor="middle" font-size="15" font-weight="500" fill="#374151" letter-spacing="1.5" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">QUEUE  →  EXECUTE  →  DONE</text>
<text x="900" y="236" text-anchor="middle" font-size="13" fill="#374151" opacity="0.75" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">three tasks at a time, one after another</text>
</svg>