<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d">
<title id="t">How one Flowstate run works</title>
<desc id="d">Three task cards enter a queue that holds at most three. Execute is pressed. Each task is processed for two seconds, one after another, then all three move to the All Tasks board.</desc>
