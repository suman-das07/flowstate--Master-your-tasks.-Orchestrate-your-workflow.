<circle cx="692" cy="82" r="11" fill="#374151"/><text x="692" y="86.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">3</text><text x="710" y="87" font-size="15" font-weight="700" fill="#374151" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">All Tasks board</text>
